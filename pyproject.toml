[build-system]
requires = ["uv_build>=0.8.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "modfish"
version = "2025.10.0"
authors = [
    {name = "Gunnar Voet", email = 'gvoet@ucsd.edu'},
    ]
description = "Python package for reading data from FastCTD and Epsifish developed by the Multiscale Ocean Dynamics group."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["physical oceanography"]
classifiers = [
    "Development Status :: 3 - Alpha",
"License :: OSI Approved :: GNU General Public License v3 (GPLv3)",

    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Oceanography",
    ]
requires-python = ">= 3.10"
dependencies = [
    "munch>=4.0.0",
    "matplotlib>=3.1",
    "gsw>=3.6",
    "numpy>=2.1",
    "scipy>=1.12",
    "xarray>=2025.1",
    "pandas>=2.0",
    "netcdf4>=1.7",
    "pyyaml>=6.0.3",
]

[project.urls]
# Homepage = "https://example.com"
Documentation = "https://modscripps.github.io/modfish"
Repository = "https://github.com/modscripps/modfish.git"
Issues = "https://github.com/modscripps/modfish/issues"
Changelog = "https://github.com/modscripps/modfish/blob/main/HISTORY.md"

[tool.pytest.ini_options]
# in general, do not place a `__init__.py` in your tests
# options are explained here:
# https://learn.scientific-python.org/development/guides/pytest/
# minversion = "6.0"
# addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
# xfail_strict = true
# filterwarnings = ["error"]
# log_cli_level = "info"
testpaths = ["tests"]
markers = [
    "slow: cross-validation against the mod-server mount and the rust reader; skips when either is unavailable",
]

[dependency-groups]
dev = [
    "ipython>=8.37.0",
    "pdoc>=15.0.4",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]
